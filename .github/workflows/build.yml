name: Build Jervis APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # Locate directory containing buildozer.spec and run build there
          SPEC_DIR=$(find . -name "buildozer.spec" -exec dirname {} \;)
          if [ -n "$SPEC_DIR" ]; then
            cd "$SPEC_DIR"
            echo "Found buildozer.spec in $SPEC_DIR"
            yes | buildozer android debug
          else
            echo "ERROR: Could not find buildozer.spec anywhere in repo!"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jervis-Android-App
          path: "**/bin/*.apk"